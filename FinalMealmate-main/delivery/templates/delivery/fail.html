{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Failed - MealMate</title>
    <link rel="stylesheet" href="{% static 'delivery/css/style.css' %}">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">Meal<span>Mate</span></div>
            <nav>
                <a href="/">Home</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="form-container fade-in" style="max-width: 500px; text-align: center;">
            <div style="font-size: 4rem; margin-bottom: 1rem;">❌</div>
            <h1 style="color: var(--warning-color); margin-bottom: 1rem;">Login Failed</h1>
            <p style="color: #666; margin-bottom: 2rem;">Invalid username or password. Please try again.</p>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <a href="{% url 'open_signin' %}" class="btn btn-primary">Try Again</a>
                <a href="{% url 'open_signup' %}" class="btn btn-secondary">Create Account</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 MealMate. All rights reserved.</p>
    </footer>
</body>
</html>
