{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - MealMate</title>
    <link rel="stylesheet" href="{% static 'delivery/css/style.css' %}">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">Meal<span>Mate</span></div>
            <nav>
                <a href="/">Home</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="form-container fade-in" style="max-width: 600px;">
            <h1 style="text-align: center; margin-bottom: 2rem; color: var(--primary-color);">Create Account</h1>
            <p style="text-align: center; color: #666; margin-bottom: 2rem;">Join MealMate and start ordering delicious food</p>

            <form action="{% url 'signup' %}" method="post">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="text" id="mobile" name="mobile" placeholder="10-digit phone number" required>
                </div>

                <div class="form-group">
                    <label for="address">Delivery Address</label>
                    <textarea id="address" name="address" placeholder="Enter your complete address" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block">Create Account</button>
                
                <p style="text-align: center; margin-top: 1rem;">
                    Already have an account? <a href="{% url 'open_signin' %}" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Sign In</a>
                </p>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 MealMate. All rights reserved.</p>
    </footer>
</body>
</html>
