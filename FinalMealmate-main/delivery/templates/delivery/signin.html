{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - MealMate</title>
    <link rel="stylesheet" href="{% static 'delivery/css/style.css' %}">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">Meal<span>Mate</span></div>
            <nav>
                <a href="/">Home</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="form-container fade-in" style="max-width: 500px;">
            <h1 style="text-align: center; margin-bottom: 2rem; color: var(--primary-color);">Welcome Back</h1>
            <p style="text-align: center; color: #666; margin-bottom: 2rem;">Sign in to continue ordering</p>

            <form action="{% url 'signin' %}" method="post">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block">Sign In</button>
                
                <p style="text-align: center; margin-top: 1rem;">
                    Don't have an account? <a href="{% url 'open_signup' %}" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Create one</a>
                </p>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 MealMate. All rights reserved.</p>
    </footer>
</body>
</html>
