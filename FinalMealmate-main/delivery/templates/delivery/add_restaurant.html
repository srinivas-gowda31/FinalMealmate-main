{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Restaurant - MealMate Admin</title>
    <link rel="stylesheet" href="{% static 'delivery/css/style.css' %}">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">Meal<span>Mate</span></div>
            <nav>
                <a href="/">Home</a>
                <span class="user-info">🍽️ Admin</span>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="form-container fade-in">
            <h1 style="text-align: center; margin-bottom: 2rem; color: var(--primary-color);">🏪 Add New Restaurant</h1>

            <form action="{% url 'add_restaurant' %}" method="post">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="name">Restaurant Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter restaurant name" required>
                </div>

                <div class="form-group">
                    <label for="picture">Restaurant Logo/Image URL</label>
                    <input type="url" id="picture" name="picture" placeholder="https://example.com/image.jpg" required>
                </div>

                <div class="form-group">
                    <label for="cuisine">Cuisine Type</label>
                    <input type="text" id="cuisine" name="cuisine" placeholder="e.g., Italian, Chinese, North Indian" required>
                </div>

                <div class="form-group">
                    <label for="rating">Initial Rating</label>
                    <input type="number" id="rating" name="rating" min="0" max="5" step="0.5" value="4.5" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block">✅ Add Restaurant</button>
                <a href="{% url 'open_show_restaurant' %}" class="btn btn-secondary btn-lg btn-block" style="text-decoration: none; margin-top: 1rem;">
                    Cancel
                </a>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 MealMate. All rights reserved.</p>
    </footer>
</body>
</html>
